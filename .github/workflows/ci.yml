name: CI

# Runs the same checks as the daily build: install, typecheck, lint, format
# check, unit tests, production build and dependency audit.
on:
  push:
    branches:
      - main
      - "auto/**"
  pull_request:

# Read-only: this workflow never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # No real keys in CI: SKIP_ENV_VALIDATION turns the env check off.
      - name: Production build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high
