<h2>Choose a new PropDesk password</h2>

<p>Someone asked to reset the password for this email address.</p>
<p>Tap this button to choose a new password. It works once, for 1 hour:</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
    style="
      display: inline-block;
      padding: 14px 24px;
      background: #0a0a0a;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
    "
    >Choose a new password</a
  >
</p>

<p>
  If you did not ask for this, you can ignore this email. Your password stays
  the same.
</p>
